<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- título y descripción reales vienen de profile.json (site.title, site.description) -->
  <title>Julián Bejarano</title>
  <meta name="description" content="">
  <script>document.documentElement.classList.replace("no-js", "js");</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.15/dist/lenis.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Este HTML es solo el esqueleto: el contenido sale de profile.json y projects.json.
       data-bind="ruta.en.el.json" pone ese texto en el elemento (main.js, renderProfile) -->

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <a class="logo" href="#home" data-bind="site.name"></a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-overlay">Menú</button>
  </header>

  <nav class="menu-overlay" id="menu-overlay" aria-label="Principal">
    <ul id="menu-list"></ul>
  </nav>

  <main id="main">
    <noscript><p class="noscript-note">Esta página necesita JavaScript para mostrar su contenido.</p></noscript>

    <section class="section hero" id="home">
      <p class="eyebrow" data-bind="hero.eyebrow"></p>
      <h1 data-split="scramble" data-placeholder data-bind="hero.headline"></h1>
    </section>

    <section class="section about" id="about" aria-labelledby="about-title">
      <h2 class="section-label" id="about-title" data-bind="about.title"></h2>
      <p class="lead" data-reveal="letters-blur" data-bind="about.text"></p>
      <a class="text-link" href="#info" data-reveal data-bind="about.linkLabel"></a>
    </section>

    <section class="section featured" id="featured" aria-labelledby="featured-title">
      <h2 class="section-label" id="featured-title" data-bind="featured.title"></h2>
      <div class="featured-body">
        <div id="featured-media"></div>
        <div class="featured-text" data-reveal>
          <h3 id="featured-name"></h3>
          <p data-bind="featured.description"></p>
          <a class="text-link" id="featured-link" target="_blank" rel="noopener" data-bind="featured.linkLabel"></a>
        </div>
      </div>
    </section>

    <section class="section work" id="work" aria-labelledby="work-title">
      <h2 class="section-title" id="work-title" data-split data-bind="work.title"></h2>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <section class="section services" id="services" aria-labelledby="services-title">
      <h2 class="section-title" id="services-title" data-split data-bind="services.title"></h2>
      <div class="services-grid">
        <div data-reveal>
          <h3 class="section-label" data-bind="services.capabilitiesTitle"></h3>
          <ul class="plain-list" id="capabilities-list"></ul>
        </div>
        <div data-reveal>
          <h3 class="section-label" data-bind="services.inspirationsTitle"></h3>
          <p data-placeholder data-bind="services.inspirations"></p>
        </div>
      </div>
    </section>

    <section class="section info" id="info" aria-labelledby="info-title">
      <h2 class="section-title" id="info-title" data-split data-bind="info.title"></h2>
      <div class="info-grid">
        <img class="portrait" id="portrait" alt="" width="771" height="1005" loading="lazy" data-reveal>
        <div class="bio" data-reveal>
          <div id="bio-paragraphs"></div>
          <h3 class="section-label" data-bind="info.educationTitle"></h3>
          <ol class="timeline" id="education-list"></ol>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="contact">
    <h2 class="section-title" data-split data-bind="contact.title"></h2>
    <ul class="plain-list contact-list" id="contact-list"></ul>
    <p class="copyright" data-bind="contact.copyright"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.15/dist/lenis.min.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
